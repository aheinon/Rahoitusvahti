name: Collect funding calls

on:
  schedule:
    - cron: "17 3 * * *"     # every night at 03:17 UTC (05:17 / 06:17 Finnish time)
  workflow_dispatch: {}       # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r collector/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q collector/tests

      - name: Collect and save
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collector/main.py
