name: Describe partner organisations

on:
  schedule:
    - cron: "17 5 3 * *"      # 3rd of each month 05:17 UTC: new partners only
  workflow_dispatch:
    inputs:
      limit:
        description: "Max organisations this run (empty = max_per_run in config.yaml)"
        required: false

permissions:
  contents: read

jobs:
  describe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: Write descriptions with Claude and web search
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: python collector/describe.py ${LIMIT:+--limit "$LIMIT"}
