# Rahoitusvahti - collector settings
# Changes take effect on the next run.

sources:
  eu:
    enabled: true
    # Programmes (abbreviation) that are NOT collected
    exclude_programmes: [EDF, ISF, JUST, EP, PERICLES IV, HUMA, NDICI, SOCPL, EUBA, IMCAP, IMREG, PPPA, "H2020 - 2014-2020", "COSME - 2014-2020"]
  bf:
    enabled: true
  aka:
    enabled: true
  eura:
    enabled: true
    include_business_aid: false   # business development grants (YRTU) excluded by default
  interreg:
    enabled: true
    finland_only: false           # true = only calls where Finland is eligible
  cetp:                           # Clean Energy Transition Partnership joint calls (Business Finland in Finland)
    enabled: true
  oph:                            # EDUFI (Opetushallitus): decentralised Erasmus+ actions and EDUFI grants
    enabled: true
    max_pages: 8
    # kept when tagged with one of these and none of exclude_tags (titles mentioning Erasmus are always kept)
    include_tags: [Erasmus+, Korkeakoulutus, Ammatillinen koulutus, Aikuiskoulutus, Jatkuva oppiminen, Kansainvälistyminen]
    exclude_tags: [Luova Eurooppa, Euroopan solidaarisuusjoukot, "EU:n nuoriso-ohjelmat", Erasmus+ nuorisoalalle, Nuorisotyö, Perusopetus, Varhaiskasvatus, Kulttuuri, Urheilu]
  va:                             # Haeavustuksia.fi state grants: ministries (YM, TEM, MMM, OKM), Jotpa,
    enabled: true                 # elinvoimakeskus centres, regional councils, agencies
    # organisations (abbreviation) left out: own source already, or nothing a UAS can apply for
    exclude_organisations: [BF, SA, OPH, SES, KUVI, MV, STEA, THL, PLM, KELA, VK, KA, RVL, PSR, VARKE, ARA, STM, OM, UM]
    # titles left out (regular expression, case-insensitive)
    exclude_titles: "yksityisti?e|yksityistei|enskild|EMKVR|kalast|kalatalou|vesiviljel|porotalou|kolt|rakennetuista|maaseudun (hanke|yritys)tuet|yrityksen kehittämisavustu|yritysten kehittämisavustu|ravirado|liikun|urheil|museo|kirjasto|nuoriso|turvakoti|romutus|hissi|asunto|puolustusteollisuu|elokuva|taiteen|kulttuurin|rakennusperinnö|rauhoitettujen eläinten|saariston|järjestöille|riistanhoito|väliraportti"
  maaseutu:                       # EU rural development (CAP): elinvoimakeskus and Leader selection periods
    enabled: true
    pages:
      - region: Varsinais-Suomi
        authority: Lounais-Suomen elinvoimakeskus
        url: https://maaseutu.fi/lounais-suomi/varsinais-suomi/rahoitus-varsinais-suomessa/valintajaksot/
    include_sections: "^(Hanketuet|Leader\\b)"   # business aid and farm investments are left out
  saatiot:                        # Foundations: Claude reads each page and picks out the next application period.
    enabled: true                 # Add or remove foundations here. A page that cannot be read is skipped.
    foundations:
      - name: Maj ja Tor Nesslingin säätiö
        url: https://nessling.fi/en/open-calls/
        note: Environmental research and its use; personal grants and implementation project grants
      - name: Suomen Kulttuurirahasto, Varsinais-Suomen rahasto
        url: https://www.skr.fi/en/regional-funds/varsinais-suomi-regional-fund/varsinais-suomi-grants
        note: Regional fund for science, art and culture in Varsinais-Suomi; individuals and working groups
      - name: Koneen Säätiö
        url: https://koneensaatio.fi/
        note: Research, art and society; annual call in autumn; individuals and research groups
      - name: Tekniikan edistämissäätiö (TES)
        url: https://www.tekniikanedistamissaatio.fi/
        note: Technology research; personal grants for researchers
      - name: Fortumin ja Nesteen säätiö
        url: https://www.fortumandnestefoundation.fi/
        note: Energy and environmental research; personal grants
      - name: Emil Aaltosen Säätiö
        url: https://emilaaltonen.fi/
        note: Research grants in all fields; individuals and research groups
      - name: Teknologiateollisuuden 100-vuotissäätiö
        url: https://teknologiateollisuus.fi/fi/teknologiateollisuuden-100-vuotissaatio
        note: Technology research and education; calls for universities and research organisations

# Relevance profile: Claude's description of the organisation and the weighted keywords.
# Used only to create the profile on the first run. After that, admins edit it in the app
# (Profile tab), and changes here have no effect.
profile:
  organisation: >
    Turku University of Applied Sciences (Turku UAS), New Energy Research Centre (NERC), Finland.
    Applied RDI in solar PV, battery energy storage, agrivoltaics, energy communities, smart grids,
    hydrogen and energy efficiency. Works closely with companies, municipalities and vocational
    education (e.g. Erasmus+ Centres of Vocational Excellence). Based in Southwest Finland
    (Varsinais-Suomi). Applies as a research organisation, usually as a consortium partner or coordinator.
  keywords:   # word: weight (a hit in the title counts double). Finnish and English.
    aurinko: 3
    solar: 3
    photovolta: 3
    agrivolta: 4
    agri-pv: 4
    akku: 3
    battery: 3
    batteries: 3
    energy storage: 3
    energiavarasto: 3
    energiayhteisö: 4
    energy communit: 4
    smart grid: 3
    älyverkko: 3
    grid: 1
    vety: 2
    hydrogen: 2
    energiatehokkuus: 2
    energy efficiency: 2
    renewable: 1
    uusiutuva: 1
    energy: 1
    energia: 1
    vocational: 2
    ammatillinen: 2
    skills: 1
    osaaminen: 1
    tutkimusorganisaatio: 1
    research organisation: 1
    varsinais-suomi: 3
  negative:   # lowers the score
    defence: -3
    puolustus: -3
    medical: -2
    cancer: -3
    space: -1

ai:
  # AI scoring is enabled when the GitHub secret ANTHROPIC_API_KEY is set.
  model: claude-haiku-5-5
  # Only new or changed calls are scored. The cap keeps costs predictable.
  max_calls_per_run: 700
  # Requests to Claude at the same time. 8 keeps a first run of ~450 calls to a few minutes.
  parallel_requests: 8
  # Minimum keyword score for EU topics to be scored and summarised. 0 = every topic gets a
  # summary (about 365 topics on the first run); 1 skips topics with no keyword hits.
  eu_min_keyword_score: 0
  # Number of the team's latest "Is this relevant for us?" answers shown to Claude as examples
  team_examples: 12

retention_days_after_close: 60   # how long closed calls stay in the list

network:                         # network.py (weekly): partner network and consortium radar from CORDIS
  organisation_id: "948193431"   # Turku UAS in CORDIS (TURUN AMMATTIKORKEAKOULU OY)
  radar_projects: 4              # similar funded projects shown per Horizon Europe call
  radar_min_score: 0.15          # 0-1, higher = only close matches

describe:                        # describe.py (monthly or by hand): AI descriptions of partner organisations
  # energy = partners of energy projects in the partner register, partners of NERC's projects,
  #          EU partners of NERC's projects and the team's own partner list (~250-350 organisations)
  # all    = every partner organisation (~1700, roughly $30-40 in total)
  scope: energy
  model: claude-haiku-5-5
  searches_per_org: 3            # web searches Claude may make per organisation ($10 per 1000 searches)
  max_per_run: 300               # cap per run; the next run continues where this one stopped
  refresh_days: 365              # descriptions older than this are rewritten (team-edited ones never)
  parallel_requests: 4
